<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WeRunIt</title>
<meta name="theme-color" content="#141415">
<meta name="description" content="WeRunIt: teman latihan lari yang paham datamu. Rencana latihan, log lari, strategi race, sepatu, dan latihan bareng teman.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0eb;--s1:#ffffff;--s2:#e4e7e0;--line:#d3d7cf;--tx:#15181a;--mu:#5b636a;
  --acc:#c8f03c;--acc-tx:#4a6300;--on-acc:#15181a;--blue:#4f6f96;--warn:#a85d12;--bad:#b83a28;--ok:#3f7d1f;
  --c-easy:#4f78a6;--c-long:#6f8f00;--c-recovery:#5f8a72;--c-locked:#c2800f;--c-elevation:#8059c4;--c-benchmark:#c9483a;--c-race:#15181a;--c-strength:#23928a;--c-rest:#a0a69d;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131517;--s1:#1b1e21;--s2:#24282c;--line:#31363b;--tx:#f1f3ee;--mu:#99a1a7;
    --acc:#c8f03c;--acc-tx:#c8f03c;--on-acc:#131517;--blue:#7b9cc2;--warn:#f0a63c;--bad:#f2725f;--ok:#9fd65a;
    --c-easy:#7b9cc2;--c-long:#c8f03c;--c-recovery:#8fb29d;--c-locked:#f0a63c;--c-elevation:#b392f0;--c-benchmark:#f2725f;--c-race:#ffffff;--c-strength:#6fcdc3;--c-rest:#5a6066;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131517;--s1:#1b1e21;--s2:#24282c;--line:#31363b;--tx:#f1f3ee;--mu:#99a1a7;
  --acc:#c8f03c;--acc-tx:#c8f03c;--on-acc:#131517;--blue:#7b9cc2;--warn:#f0a63c;--bad:#f2725f;--ok:#9fd65a;
  --c-easy:#7b9cc2;--c-long:#c8f03c;--c-recovery:#8fb29d;--c-locked:#f0a63c;--c-elevation:#b392f0;--c-benchmark:#f2725f;--c-race:#ffffff;--c-strength:#6fcdc3;--c-rest:#5a6066;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Archivo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.shell{display:flex;min-height:100%}
.side{display:none}
main{flex:1;min-width:0;max-width:780px;margin:0 auto;padding:18px 16px 110px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--s1);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mu)}
.tabbar button svg{width:21px;height:21px}
.tabbar button.on{color:var(--tx)}
.tabbar button.on svg{stroke:var(--acc-tx)}
.ico{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:900px){
  .side{display:block;width:232px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);padding:22px 12px;background:var(--s1)}
  .side .brand{font-weight:800;font-stretch:80%;font-size:19px;line-height:1.05;padding:0 10px 18px}
  .side button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;color:var(--mu)}
  .side button.on{background:var(--s2);color:var(--tx)}
  .side hr{border:0;border-top:1px solid var(--line);margin:10px 6px}
  .tabbar{display:none}
  main{padding:28px 32px 48px}
}
h1,h2,h3{margin:0;font-weight:700;line-height:1.15}
h1{font-size:26px;font-stretch:85%;font-weight:800}
h2{font-size:19px;font-stretch:90%}
h3{font-size:15px}
p{margin:0}
.mu{color:var(--mu)}
.sm{font-size:13px}
.xs{font-size:12px}
.num{font-stretch:75%;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tab{font-variant-numeric:tabular-nums}
.sec{padding:20px 0;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.pagehead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.back{background:none;border:0;padding:4px 6px 4px 0;color:var(--mu);font-size:14px}
.lead{color:var(--mu);margin:6px 0 4px;max-width:62ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--s1);border-radius:6px;padding:9px 13px;font-size:14px;font-weight:600;line-height:1.1}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.ghost{background:none}
.btn.danger{border-color:var(--bad);color:var(--bad);background:none}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.link{background:none;border:0;padding:0;color:var(--acc-tx);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.term{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;text-decoration-color:var(--acc-tx);text-underline-offset:3px;text-decoration-thickness:2px}
.term::after{content:"?";display:inline-block;margin-left:2px;font-size:.7em;vertical-align:super;color:var(--acc-tx);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--tx);white-space:nowrap}
.pill i{width:9px;height:9px;border-radius:2px;display:inline-block;background:var(--c,var(--c-rest))}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--s2);color:var(--mu);white-space:nowrap}
.chip.done{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip.missed{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.today{background:var(--acc);color:var(--on-acc)}
.chip.sample{background:color-mix(in srgb,var(--blue) 22%,transparent);color:var(--blue)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stats>div{background:var(--s1);padding:11px 12px}
.stats .v{font-size:24px;line-height:1.1}
.stats .l{font-size:12px;color:var(--mu);margin-top:2px}
@media (min-width:560px){.stats.c3{grid-template-columns:repeat(3,1fr)}.stats.c4{grid-template-columns:repeat(4,1fr)}}
.bar{height:6px;background:var(--s2);border-radius:3px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--acc)}
.rows{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.row .grow{flex:1;min-width:0}
.row .r{text-align:right;flex:none}
button.row:hover{background:color-mix(in srgb,var(--s2) 50%,transparent)}
.day{width:44px;flex:none}
.day b{display:block;font-size:13px}
.day span{font-size:12px;color:var(--mu)}
.stripe{width:3px;align-self:stretch;border-radius:2px;background:var(--c,var(--c-rest));flex:none}
.note{border-left:3px solid var(--acc);background:var(--s1);padding:10px 12px;border-radius:0 6px 6px 0;font-size:14px}
.note.warn{border-color:var(--warn)}
.note.bad{border-color:var(--bad)}
.note.info{border-color:var(--blue)}
.hero{padding:6px 0 18px}
.hero .count{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hero .count .num{font-size:88px;line-height:.82}
.hero .count .cap{padding-bottom:4px}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:14px}
.strip{margin-top:18px}
.strip svg{width:100%;height:auto;display:block}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--mu);font-size:9px;font-family:Archivo,system-ui,sans-serif}
.chart .bp{fill:var(--s2);stroke:var(--line)}
.chart .ba{fill:var(--acc)}
.chart .ln{fill:none;stroke:var(--acc);stroke-width:2}
.chart .dt{fill:var(--acc)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.field .lbl{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--mu)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-size:15px;min-height:40px}
input[type=file]{font-size:14px;max-width:100%}
textarea{min-height:72px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.g2>*,.g3>*{min-width:0}
input[type=date],input[type=time]{min-width:0;max-width:100%}
.err{color:var(--bad);font-size:13px;margin:4px 0 10px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:36px;border:1px solid var(--line);background:var(--s1);border-radius:5px;padding:7px 4px;font-size:13px;font-weight:600}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .hd{font-size:11px;color:var(--mu);text-align:center;padding:4px 0}
.cal button{aspect-ratio:1/1.05;border:1px solid transparent;background:var(--s1);border-radius:5px;padding:4px 3px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;font-size:13px;min-width:0}
.cal button.out{background:transparent;color:var(--mu);opacity:.55}
.cal button.wed{background:repeating-linear-gradient(135deg,var(--s1) 0 5px,var(--s2) 5px 10px)}
.cal button.sel{border-color:var(--acc)}
.cal button.tdy .dn{background:var(--acc);color:var(--on-acc);border-radius:3px;padding:0 4px}
.cal .dots{display:flex;gap:2px;flex-wrap:wrap}
.cal .dots i{width:7px;height:7px;border-radius:2px;background:var(--c)}
.cal .dots i.done{outline:1.5px solid var(--tx)}
.cal .dots i.skip{opacity:.3}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}
.wk{padding:16px 0;border-bottom:1px solid var(--line)}
.wk.cur{border-left:3px solid var(--acc);padding-left:12px;margin-left:-15px}
.wk-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex{padding:14px 0;border-bottom:1px solid var(--line);display:flex;gap:12px}
.tick{width:26px;height:26px;flex:none;border:1.5px solid var(--line);border-radius:5px;background:var(--s1);display:flex;align-items:center;justify-content:center;padding:0}
.tick.on{background:var(--acc);border-color:var(--acc)}
.tick svg{width:16px;height:16px;stroke:var(--on-acc)}
details{border-bottom:1px solid var(--line);padding:4px 0}
summary{cursor:pointer;padding:10px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";color:var(--mu);font-weight:400}
details[open] summary::after{content:"–"}
details .bd{padding:0 0 12px;font-size:14.5px}
details .bd p+p,details .bd p+ul,details .bd ul+p,details .bd table+p{margin-top:8px}
ul.clean{margin:6px 0 0;padding-left:18px}
ul.clean li{margin:3px 0}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:12px;color:var(--mu);font-weight:600}
.scroll{overflow-x:auto}
.morelist .row{font-size:15px;font-weight:600}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow:auto;background:var(--s1);border-radius:12px 12px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@media (min-width:700px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:560px;border-radius:10px;animation:none}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--mu);padding:0 4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media (min-width:900px){#toast{bottom:28px}}
.big-pace{font-size:56px;line-height:.9}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:12px}
.cmp>div{background:var(--s1);padding:10px 12px}
.cmp .v{font-size:26px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv>span:first-child{color:var(--mu)}
ol.steps{margin:6px 0 0;padding-left:20px}
ol.steps li{margin:4px 0}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;object-fit:cover;background:var(--s2)}
.avatar.ini{position:relative;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:var(--mu);overflow:hidden}
.avatar.ini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.acct{display:flex;align-items:center;gap:12px;padding:12px;background:var(--s1);border:1px solid var(--line);border-radius:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--mu)}
.dot.on{background:var(--ok)}
.dot.warn{background:var(--warn)}
/* tutorial */
.tour{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;gap:12px;align-items:flex-end;pointer-events:none}
.tour .bubble{pointer-events:auto;flex:1;background:var(--s1);border:1.5px solid var(--acc);border-radius:12px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.35);position:relative}
.tour .bubble::after{content:"";position:absolute;left:-8px;bottom:18px;border:8px solid transparent;border-right-color:var(--acc);border-left:0}
.tour .mascot{width:72px;height:72px;flex:none;animation:hop 1.6s ease-in-out infinite;pointer-events:auto}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (min-width:900px){.tour{left:auto;right:24px;bottom:24px;width:420px}}
.tour-hl{outline:2.5px solid var(--acc);outline-offset:6px;border-radius:6px}
.mascot-inline{width:56px;height:56px;flex:none}
.runmode{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.runmode{padding-left:calc(50% - 300px);padding-right:calc(50% - 300px)}}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:14px 10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;opacity:.5}
.badge.on{opacity:1}
.badge b{font-size:13px}
.badge span{font-size:11px;color:var(--mu);line-height:1.3}
/* v3 additions */
.tour.top{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
.tour.top .bubble::after{bottom:auto;top:18px}
@media (min-width:900px){.tour.top{top:24px}}
.tour .bubble{max-height:52vh;overflow:auto}
.touring main{padding-bottom:70vh}
@media (max-height:520px){.tour .bubble{max-height:44vh;padding:9px 12px}.tour .mascot{width:44px;height:44px}.tour{bottom:calc(60px + env(safe-area-inset-bottom,0px))}}
@media (min-width:900px){.touring main{padding-bottom:48px}}
.tour .prog{display:flex;gap:3px;margin:6px 0 2px}
.tour .prog i{flex:1;height:3px;border-radius:2px;background:var(--s2)}
.tour .prog i.on{background:var(--acc)}
.helpbtn{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:var(--s1);color:var(--mu);font-weight:800;font-size:14px;line-height:1;padding:0}
.helpbtn:hover{color:var(--tx);border-color:var(--acc)}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.syncdot{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mu);background:none;border:0;padding:0}
.dot.bad{background:var(--bad)}
.dot.busy{background:var(--blue)}
.acct .who{flex:1;min-width:0}
.acct .who .em{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.gbtn{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;color:#1f1f1f;border-radius:6px;padding:9px 14px;font-weight:600;font-size:14px}
.gbtn svg{width:18px;height:18px}
.tutlist .row .chk{color:var(--ok);font-weight:700}
.coming{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn);vertical-align:middle}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle input{width:22px;height:22px;accent-color:var(--acc)}
.mig-opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px;margin-bottom:8px}
.mig-opt b{display:block;margin-bottom:2px}
.mig-opt.rec{border-color:var(--acc)}
.upd{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border-radius:8px;background:var(--acc);color:var(--on-acc);margin-bottom:14px;font-size:14px}
.upd .btn{background:var(--on-acc);color:var(--acc);border-color:var(--on-acc)}
.upd .btn.ghost{background:none;color:var(--on-acc)}
.banner{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--acc);border-radius:8px;background:var(--s1);margin-bottom:14px}
</style>
<link rel="stylesheet" href="css/werunit.css">
</head>
<body>
<div id="boot" role="status" aria-live="polite" aria-label="Memuat WeRunIt">
  <div class="boot-mark" id="boot-mark"></div>
  <div class="boot-word">WeRun<span class="holo-text">It</span></div>
  <ol id="boot-steps"></ol>
</div>

/* ============ Local storage adapter (account-scoped, v3) ============
 * Each Firebase account has its own slot (hmtp:user:{uid}:v3); without an account the app uses
 * hmtp:anon:v3. ACTIVE_UID decides which slot persist() writes to, so two people on one device
 * never load or upload each other's data. Legacy hmtp:v1 data is copied once into the anonymous
 * slot and the legacy key itself is never modified. See docs/ARCHITECTURE.md. */
const KEYS = HMTP.KEYS;
let ACTIVE_UID = null;
let DEVICE = {deviceId:"local"};
const LS = {
  get(k){ try{ return HMTP.safeParse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
  keys(){ try{ const o = []; for(let i = 0; i < localStorage.length; i++) o.push(localStorage.key(i)); return o; }catch(e){ return []; } }
};
const slotKey = uid => uid ? KEYS.user(uid) : KEYS.anon;
const Storage = {
  load(k){ return LS.get(k || slotKey(ACTIVE_UID)); },
  save(s){ return LS.set(slotKey(ACTIVE_UID), s); }
};
try{ const r = HMTP.migrateLegacyStorage(localStorage); DEVICE = r.device; DEVICE.legacyKeys = r.legacyKeys; }catch(e){}
function saveDevice(){ const {legacyKeys, ...d} = DEVICE; LS.set(KEYS.device, d); }
// Resume the last signed-in account's own cache (offline start). Auth confirms it shortly after;
// if the session is gone, the app switches back to the anonymous slot.
if(DEVICE.lastUid && HMTP.UID_RE.test(DEVICE.lastUid) && LS.get(KEYS.user(DEVICE.lastUid)) && window.HMTP_FIREBASE_CONFIG) ACTIVE_UID = DEVICE.lastUid;

const parseYmd = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, m-1, d); };
const validYmd = s => /^\d{4}-\d{2}-\d{2}$/.test(s||"") && !isNaN(parseYmd(s));
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };

const HARI = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];

const fmtDay = s => { const d = parseYmd(s); return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]}`; };
function fmtRange(a,b){
  const A = parseYmd(a), B = parseYmd(b);
  if(A.getFullYear() !== B.getFullYear()) return `${A.getDate()} ${BULAN[A.getMonth()]} ${A.getFullYear()} – ${B.getDate()} ${BULAN[B.getMonth()]} ${B.getFullYear()}`;
  if(A.getMonth() !== B.getMonth()) return `${A.getDate()} ${BULAN[A.getMonth()]} – ${B.getDate()} ${BULAN[B.getMonth()]} ${B.getFullYear()}`;
  return `${A.getDate()}–${B.getDate()} ${BULAN[B.getMonth()]} ${B.getFullYear()}`;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const num = s => { if(s === null || s === undefined) return NaN; const t = String(s).trim().replace(",", "."); return t === "" ? NaN : Number(t); };
const fmtKm = v => { if(v === null || v === undefined || isNaN(v)) return "–"; return (Math.round(v*10)/10).toString().replace(".", ","); };
function parseDur(s){
  s = String(s||"").trim(); if(!s) return null;
  if(/^\d+([.,]\d+)?$/.test(s)) { const m = num(s); return m > 0 ? Math.round(m*60) : NaN; }
  const p = s.split(":"); if(p.length < 2 || p.length > 3 || p.some(x => !/^\d+$/.test(x))) return NaN;
  const n = p.map(Number); if(n.slice(1).some(x => x >= 60)) return NaN;
  const sec = p.length === 3 ? n[0]*3600 + n[1]*60 + n[2] : n[0]*60 + n[1];
  return sec > 0 ? sec : NaN;
}
function fmtDur(sec){

function parsePace(s){
  s = String(s||"").trim(); if(!s) return null;
  const p = s.split(":"); if(p.length !== 2 || p.some(x => !/^\d+$/.test(x))) return NaN;
  const m = Number(p[0]), sc = Number(p[1]); if(sc >= 60 || (m === 0 && sc === 0)) return NaN;
  return (m*60 + sc) / U();
}

}

function setDock(active){

    window.addEventListener("resize", () => { Object.assign(DOCK.pill.o, DOCK.geo()); DOCK.pill.snap(Math.max(0, DOCK.idx)); });
  }
  const i = NAV_MAIN.findIndex(x => x[0] === active);

}

/** Tiny bar chart for tiles. */
function miniBars(vals, {hi = -1} = {}){

/** Tiny line chart for tiles; invert = lower is better (pace), drawn higher. */

function calMonthKey(){

  for(let i = 0; i < startOff; i++) cells += `<div></div>`;

/* ---------- Log ---------- */
function vLog(){

    <div class="field"><label for="f-type">Jenis</label><select id="f-type" data-filter="type"><option value="">Semua</option>${RUN_TYPES.map(t => `<option value="${t}" ${f.type===t?'selected':''}>${TYPES[t]}</option>`).join("")}</select></div>
    <div class="field"><label for="f-dist">Jarak</label><select id="f-dist" data-filter="dist"><option value="">Semua</option><option value="s" ${f.dist==='s'?'selected':''}>Di bawah 5 km</option><option value="m" ${f.dist==='m'?'selected':''}>5–10 km</option><option value="l" ${f.dist==='l'?'selected':''}>Lebih dari 10 km</option></select></div>
    <div class="field"><label for="f-sort">Urutkan</label><select id="f-sort" data-filter="sort"><option value="new" ${f.sort==='new'?'selected':''}>Terbaru</option><option value="fast" ${f.sort==='fast'?'selected':''}>Pace tercepat</option><option value="far" ${f.sort==='far'?'selected':''}>Terjauh</option><option value="elev" ${f.sort==='elev'?'selected':''}>Tanjakan terbanyak</option></select></div>
  </div>
  <p class="sm mu" style="margin:4px 0 8px">${ls.length} lari, ${fmtKm(sum(ls, l => l.distance))} km${avgPace(ls) ? ", rata-rata " + fmtPace(avgPace(ls)) : ""}</p>
  ${ls.length ? `<div class="rows" data-tour="log-list">${ls.map(l => logRow(l, Math.max(...ls.map(x => x.distance)))).join("")}</div>` : `<p class="mu" style="padding:20px 0">${S.logs.length ? "Nggak ada lari yang cocok sama filter ini." : "Belum ada lari. Yuk catat sesi pertama kamu."}</p>`}`;

/** Share of km by session type, in neutral steps by rank (the largest share is brightest). */
const MIX_STEPS = ["var(--tx)", "var(--mu)", "var(--mu2)", "color-mix(in srgb, var(--mu2) 60%, var(--s2))", "color-mix(in srgb, var(--mu2) 35%, var(--s2))", "var(--s2)"];
/** Aktivitas: totals, 12-week km bars and the session-type mix, all from logged runs. */
function logSummary(){
  const ls = S.logs; if(!ls.length) return "";
  const ci = curWeekIdx(), weeks = PLANW.slice(Math.max(0, ci - 11), ci + 1);
  const wk = weeks.map(w => ({l:"W" + w.n, a:w.total, b:+sum(logsIn(w.start, w.end), l => l.distance).toFixed(1)}));
  const by = {}; ls.forEach(l => { by[l.type] = (by[l.type] || 0) + l.distance; });
  const tot = sum(ls, l => l.distance), mix = Object.entries(by).sort((a,b) => b[1] - a[1]);
  return `<section class="vchart vglass" aria-label="Ringkasan lari">
    <div class="vstat-row"><div class="vstat"><span>Total</span><b>${fmtKm(tot)}<span class="mu" style="font-size:12px"> km</span></b></div><div class="vstat"><span>Lari</span><b>${ls.length}</b></div><div class="vstat"><span>Pace</span><b>${avgPace(ls) ? fmtPace(avgPace(ls), false) : "–"}</b></div></div>
    <h3>Km per minggu</h3>${lgd()}${chartBars(wk, {h:120, hi:wk.length - 1})}
    <h3 style="margin-top:14px">Jenis lari</h3>
    <div class="mix" role="img" aria-label="${mix.map(([t,v]) => TYPES[t] + " " + Math.round(v / tot * 100) + " persen").join(", ")}">${mix.map(([t,v], i) => `<i style="--c:${MIX_STEPS[Math.min(i, MIX_STEPS.length - 1)]};flex:${v.toFixed(2)}"></i>`).join("")}</div>
    <div class="mix-legend">${mix.map(([t,v], i) => `<span><i style="--c:${MIX_STEPS[Math.min(i, MIX_STEPS.length - 1)]}"></i>${TYPES[t]} <b class="num">${Math.round(v / tot * 100)}%</b></span>`).join("")}</div>
  </section>`;
}

/* ---------- Review ---------- */
function blockStats(b){
  const ws = PLANW.slice(b*4, b === 7 ? PLANW.length : b*4+4), a = ws[0].start, z = ws[ws.length-1].end, t = todayYmd();
  const ls = logsIn(a, z), sess = ws.flatMap(w => w.sessions), strs = ws.flatMap(w => w.strength);
  const doneRuns = sess.filter(s => logFor(s.id)).length, plannedRuns = sess.length, plannedKm = sum(ws, w => w.total), km = sum(ls, l => l.distance);
  const bench = ls.filter(l => l.type === "benchmark" && paceOf(l)), cis = S.checkins.filter(c => c.date >= a && c.date <= z);
  const elevSess = sess.filter(s => s.type === "elevation"), benchSess = sess.filter(s => s.type === "benchmark");
  return {b, ws, a, z, ls, doneRuns, plannedRuns, plannedKm, km, runRate:doneRuns/plannedRuns, kmRate:km/plannedKm,
    longest:ls.length ? Math.max(...ls.map(l => l.distance)) : null, pace:avgPace(ls),
    bestBench:bench.length ? bench.reduce((m,l) => paceOf(l) < paceOf(m) ? l : m) : null,
    elev:sum(ls, l => l.elev||0), strN:S.strength.filter(r => r.date >= a && r.date <= z).length, strPlanned:strs.length,
    rec:cis.length ? sum(cis, c => readiness(c).v)/cis.length : null, cisN:cis.length, pain:cis.filter(c => c.pain >= 4).length,
    elevPlanned:elevSess.length, elevDone:elevSess.filter(s => logFor(s.id)).length, benchPlanned:benchSess.length, benchDone:benchSess.filter(s => logFor(s.id)).length,
    started:t >= a, ended:t > z};
}
function reviewOf(b){
  const s = blockStats(b), p = b > 0 ? blockStats(b-1) : null, imp = [], con = [], need = [];
  if(!s.ls.length) return {s, none:true};
  const pv = p && p.ls.length ? p : null;
  if(pv){
    const dk = s.km - pv.km;
    if(dk > 0.5) imp.push(`Total km naik ${fmtKm(dk)} km dari bulan lalu (${fmtKm(pv.km)} → ${fmtKm(s.km)} km).`);
    else if(dk >= -0.5) con.push(`Total km mirip bulan lalu (${fmtKm(s.km)} km).`);
    else need.push(`Total km turun ${fmtKm(-dk)} km dari bulan lalu.`);
    if(s.longest !== null && pv.longest !== null){
      if(s.longest - pv.longest >= 0.5) imp.push(`Lari terjauh naik dari ${fmtKm(pv.longest)} ke ${fmtKm(s.longest)} km.`);
      else if(Math.abs(s.longest - pv.longest) < 0.5) con.push(`Lari terjauh tetap di ${fmtKm(s.longest)} km.`);
    }
    if(s.pace && pv.pace){
      const d = pv.pace - s.pace;
      if(d > 5) imp.push(`Pace rata-rata lebih cepat ${Math.round(d*U())} detik ${unitLbl()} (${fmtPace(pv.pace)} → ${fmtPace(s.pace)}).`);
      else if(d >= -5) con.push(`Pace rata-rata stabil di sekitar ${fmtPace(s.pace)}.`);
      else need.push(`Pace rata-rata lebih lambat ${Math.round(-d*U())} detik ${unitLbl()}. Bisa karena panas, rute naik-turun, atau kamu sengaja santai. Cek RPE-nya.`);
    }
    if(s.bestBench && pv.bestBench){
      const d = paceOf(pv.bestBench) - paceOf(s.bestBench);
      if(d > 3) imp.push(`Benchmark lebih cepat: ${fmtPace(paceOf(s.bestBench))} vs ${fmtPace(paceOf(pv.bestBench))}.`);
      else con.push(`Benchmark mirip bulan lalu (${fmtPace(paceOf(s.bestBench))}).`);
    }
    if(s.runRate > pv.runRate + 0.05) imp.push(`Makin rutin: ${s.doneRuns}/${s.plannedRuns} sesi (bulan lalu ${pv.doneRuns}/${pv.plannedRuns}).`);
  }
  if(s.runRate >= 0.9) con.push(`Rutin banget: ${s.doneRuns} dari ${s.plannedRuns} sesi lari beres.`);
  else if(s.ended || s.runRate < 0.5) need.push(`Baru ${s.doneRuns} dari ${s.plannedRuns} sesi lari yang tercatat.`);
  if(s.ended && s.elevPlanned && !s.elevDone) need.push("Sesi elevation bulan ini belum dicatat.");
  if(s.ended && s.benchPlanned && !s.benchDone) need.push("Benchmark bulan ini belum dicatat.");
  if(s.ended && s.strN < s.strPlanned/2) need.push(`Strength baru ${s.strN} dari ${s.strPlanned} sesi.`);
  if(s.rec !== null && s.rec < 3) need.push("Skor check-in rata-rata rendah. Cek tidur, makan, dan stres.");
  if(s.pain) need.push(`Ada ${s.pain} check-in dengan nyeri tinggi. Jangan naik beban dulu.`);
  let decision;
  if(!s.ended) decision = `Bulan ini masih jalan sampai ${fmtD(s.z)}. Saran lanjut atau ulang muncul setelah bulannya selesai.`;
  else if(s.runRate >= 0.75 && s.kmRate >= 0.75 && !s.pain && (s.rec === null || s.rec >= 3)) decision = "Lanjut. Data kamu aman buat naik ke beban bulan depan.";
  else decision = "Ulang dulu beban minggu terakhir (atau turunin dikit) sebelum naik. Jangan naik cuma karena kalender bilang begitu.";
  const nextGoal = b < 7 ? BLOCK_INFO[b+1].goal : "Race 21,1 km dengan badan segar.";

function chartBars(items, {h=150, fmt = v => v, hi=-1} = {}){
  const W = 340, H = h, pl = 24, pb = 16, pt = 8, n = items.length;
  const max = Math.max(1, ...items.map(i => Math.max(i.a||0, i.b||0))), bw = (W - pl - 2) / n, ih = H - pt - pb;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">`;
  [0,.5,1].forEach(f => { const y = pt + ih*(1-f); s += `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" class="gl"/><text x="${pl-4}" y="${y+3}" class="ax" text-anchor="end">${fmt(Math.round(max*f*10)/10)}</text>`; });
  const step = Math.ceil(n/8);
  items.forEach((it,i) => {
    const x = pl + i*bw, ha = ih*(it.a||0)/max, hb = ih*(it.b||0)/max;
    if(it.a) s += `<rect x="${x+bw*.12}" y="${pt+ih-ha}" width="${bw*.76}" height="${ha}" class="bp"/>`;
    if(it.b) s += `<rect x="${x+bw*.26}" y="${pt+ih-hb}" width="${bw*.48}" height="${hb}" rx="2" class="ba${i===hi?' hi':''}"/>`;
    if(i % step === 0) s += `<text x="${x+bw/2}" y="${H-3}" class="ax" text-anchor="middle">${esc(it.l)}</text>`;
  });
  return s + "</svg>";
}
function chartLine(pts, {h=150, fmt = v => v} = {}){
  if(pts.length < 2) return `<p class="sm mu" style="padding:14px 0">Butuh minimal 2 data buat grafik ini.</p>`;
  const W = 340, H = h, pl = 34, pb = 16, pt = 10, ih = H - pt - pb, iw = W - pl - 10;
  const vs = pts.map(p => p.v); let lo = Math.min(...vs), hi = Math.max(...vs); if(hi - lo < 10){ lo -= 10; hi += 10; }
  const X = i => pl + i*iw/(pts.length-1), Y = v => pt + ih*(v-lo)/(hi-lo);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">`;
  [lo,(lo+hi)/2,hi].forEach(v => { s += `<line x1="${pl}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${pl-4}" y="${Y(v)+3}" class="ax" text-anchor="end">${fmt(v)}</text>`; });
  s += `<polyline class="ln" points="${pts.map((p,i) => `${X(i)},${Y(p.v)}`).join(" ")}"/>`;
  pts.forEach((p,i) => { s += `<circle cx="${X(i)}" cy="${Y(p.v)}" r="2.6" class="dt"/>`; });
  const step = Math.ceil(pts.length/6);
  pts.forEach((p,i) => { if(i % step === 0) s += `<text x="${X(i)}" y="${H-3}" class="ax" text-anchor="middle">${esc(p.l)}</text>`; });
  return s + "</svg>";
}

  </div>`;

/* ---------- Goals ---------- */
function goalValue(id){
  const done = s => !!logFor(s.id);
  switch(id){
    case "consist": return PLANW.filter(w => w.sessions.every(done)).length;
    case "volume": return PLANW.reduce((m,w) => Math.max(m, sum(logsIn(w.start,w.end), l => l.distance)), 0);
    case "longrun": return S.logs.filter(l => l.type !== "race").reduce((m,l) => Math.max(m, l.distance), 0);
    case "pace": return allSessions().filter(s => s.type === "locked" || s.type === "benchmark").filter(s => { const c = lockedCfg(s.id, s.n, s.type), lg = logFor(s.id); return c.targetPace && lg && paceOf(lg) && Math.abs(paceOf(lg) - c.targetPace) <= 10; }).length;
    case "elev": return allSessions().filter(s => s.type === "elevation" && done(s)).length;
    case "strength": return S.strength.length;
    case "bench": return allSessions().filter(s => s.type === "benchmark" && done(s)).length;
  }
  return 0;
}
function vGoals(){
  const g = S.goals, race = allSessions().find(s => s.type === "race"), rl = logFor(race.id);
  return `${storageNote()}${pageHead("Goals", "Progres dihitung dari lari yang beneran kamu catat. Goal baru ditandai tercapai kalau datanya ada.")}
  <div class="sec" style="margin-top:8px" data-tour="goal-main">
    <p class="sm mu">Goal utama</p>
    <h2 style="font-size:22px;margin:4px 0;font-stretch:85%">${esc(g.main.title)}</h2>
    <p class="mu">${esc(g.main.target)}</p>
    <p style="margin-top:8px">${rl ? `<span class="chip done">Tercapai</span> Finish ${fmtKm(rl.distance)} km${rl.duration ? " dalam " + fmtDur(rl.duration) : ""}.` : `<span class="chip">Belum</span> <span class="sm mu">Ke-centang sendiri pas kamu catat race di ${fmtDay(race.date)}.</span>`}</p>
    <button class="btn sm ghost" style="margin-top:10px" data-act="goalEdit" data-id="main">Edit goal utama</button>
  </div>
  ${badgesSection()}
  <div class="sec" data-tour="goal-ms"><div class="sec-h"><h2>Milestone</h2></div>
    ${g.items.map(it => { const v = goalValue(it.id), pct = Math.min(100, Math.round(v / it.target * 100)), ok = v >= it.target; return `<div style="padding:12px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><b>${esc(it.title)}</b>${ok ? '<span class="chip done">Tercapai</span>' : ""}</div>
      <div style="display:flex;justify-content:space-between;gap:10px;margin:6px 0" class="sm"><span class="tab">${fmtKm(v)} / ${fmtKm(it.target)} ${esc(it.unit)}</span><button class="link sm" data-act="goalEdit" data-id="${it.id}">Edit</button></div>
      <div class="bar"><span style="width:${pct}%"></span></div></div>`; }).join("")}
  </div>
  ${raceChecklist()}`;
}

function pcOut(d, t){
  const D = num(d), Tm = parseDur(t);
  if(!(D > 0) || !Tm || isNaN(Tm)) return `<p class="err">Isi jarak (lebih dari 0) dan waktu dengan format mm:ss atau j:mm:ss.</p>`;
  const r = x => Tm * Math.pow(x / D, 1.06);
  return `<div class="kv"><span>Pace rata-rata</span><b class="tab">${fmtPace(Tm/D)}</b></div>
    <div class="kv"><span>Perkiraan 5K</span><span class="tab">${fmtDur(r(5))}</span></div>
    <div class="kv"><span>Perkiraan 10K</span><span class="tab">${fmtDur(r(10))}</span></div>
    <div class="kv"><span>Perkiraan Half Marathon</span><span class="tab">${fmtDur(r(21.0975))}</span></div>

}
function ppOut(p, d){
  const P = parsePace(p), D = num(d);
  if(!P || isNaN(P)) return `<p class="err">Isi pace dengan format mm:ss.</p>`;
  return `<div class="kv"><span>5K</span><span class="tab">${fmtDur(P*5)}</span></div><div class="kv"><span>10K</span><span class="tab">${fmtDur(P*10)}</span></div>
    <div class="kv"><span>Half Marathon (21,1 km)</span><b class="tab">${fmtDur(P*21.0975)}</b></div>${D > 0 ? `<div class="kv"><span>${fmtKm(D)} km</span><span class="tab">${fmtDur(P*D)}</span></div>` : ""}`;
}

/* ============ Import file lari (GPX / TCX / Strava CSV) ============ */
const childTxt = (el, name) => { const c = el.getElementsByTagNameNS("*", name)[0]; return c ? c.textContent.trim() : null; };
function hav(a, b){ const R = 6371000, r = x => x*Math.PI/180, dLa = r(b.lat-a.lat), dLo = r(b.lon-a.lon); const h = Math.sin(dLa/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function elevGain(eles){ let g = 0, base = null; eles.forEach(e => { if(e === null || isNaN(e)) return; if(base === null){ base = e; return; } if(e - base >= 3){ g += e - base; base = e; } else if(base - e >= 3) base = e; }); return Math.round(g); }
function hrStats(hs){ const v = hs.filter(x => x > 30 && x < 240); return v.length ? {avg:Math.round(sum(v)/v.length), max:Math.max(...v)} : {avg:null, max:null}; }
function parseGpx(doc, name){
  const pts = [...doc.getElementsByTagNameNS("*","trkpt")].map(p => ({lat:+p.getAttribute("lat"), lon:+p.getAttribute("lon"), ele:childTxt(p,"ele") !== null ? +childTxt(p,"ele") : null, t:childTxt(p,"time"), hr:childTxt(p,"hr") !== null ? +childTxt(p,"hr") : null}));
  if(pts.length < 2) throw "File GPX ini nggak punya titik rute.";
  let d = 0; for(let i = 1; i < pts.length; i++) d += hav(pts[i-1], pts[i]);
  const times = pts.map(p => p.t ? Date.parse(p.t) : NaN).filter(x => !isNaN(x));
  const dur = times.length > 1 ? (times[times.length-1] - times[0]) / 1000 : null, hr = hrStats(pts.map(p => p.hr));
  const title = childTxt(doc, "name") || name, type = (childTxt(doc,"type") || "").toLowerCase();
  return [{extId:times.length ? "t:" + new Date(times[0]).toISOString().slice(0,16) : null, date:times.length ? ymd(new Date(times[0])) : null, distance:+(d/1000).toFixed(2), duration:dur ? Math.round(dur) : null, elev:elevGain(pts.map(p => p.ele)), hrAvg:hr.avg, hrMax:hr.max, name:title, isRun:!type || /run|lari|9/.test(type)}];
}
function parseTcx(doc, name){
  return [...doc.getElementsByTagNameNS("*","Activity")].map(act => {
    const laps = [...act.getElementsByTagNameNS("*","Lap")];
    let dist = sum(laps, l => +(childTxt(l,"DistanceMeters") || 0)), dur = sum(laps, l => +(childTxt(l,"TotalTimeSeconds") || 0));
    const tps = [...act.getElementsByTagNameNS("*","Trackpoint")];
    const eles = tps.map(t => childTxt(t,"AltitudeMeters") !== null ? +childTxt(t,"AltitudeMeters") : null);
    const hrs = tps.map(t => { const h = t.getElementsByTagNameNS("*","HeartRateBpm")[0]; return h ? +childTxt(h,"Value") : null; });
    if(!dist){ const pos = tps.map(t => ({lat:+childTxt(t,"LatitudeDegrees"), lon:+childTxt(t,"LongitudeDegrees")})).filter(p => !isNaN(p.lat) && p.lat); for(let i = 1; i < pos.length; i++) dist += hav(pos[i-1], pos[i]); }
    const start = childTxt(act,"Id") || (laps[0] && laps[0].getAttribute("StartTime")), hr = hrStats(hrs), sport = (act.getAttribute("Sport") || "").toLowerCase();
    return {extId:start && !isNaN(Date.parse(start)) ? "t:" + new Date(Date.parse(start)).toISOString().slice(0,16) : null, date:start && !isNaN(Date.parse(start)) ? ymd(new Date(Date.parse(start))) : null, distance:+(dist/1000).toFixed(2), duration:dur ? Math.round(dur) : null, elev:elevGain(eles), hrAvg:hr.avg, hrMax:hr.max, name, isRun:!sport || sport === "running"};
  });
}
function csvRows(text){
  const rows = []; let row = [], cur = "", q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if(c === '"') q = true; else if(c === ","){ row.push(cur); cur = ""; } else if(c === "\n" || c === "\r"){ if(c === "\r" && text[i+1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; } else cur += c;
  }
  if(cur || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
const MON = {jan:0,feb:1,mar:2,apr:3,may:4,mei:4,jun:5,jul:6,aug:7,agu:7,sep:8,oct:9,okt:9,nov:10,dec:11,des:11};
function parseStravaDate(s){
  const m = String(s).match(/([A-Za-z]{3})\w*\s+(\d{1,2}),?\s+(\d{4}),?\s+(\d{1,2}):(\d{2}):(\d{2})\s*(AM|PM)?/i);
  if(m && MON[m[1].toLowerCase()] !== undefined){ let h = +m[4]; if(m[7]){ const pm = m[7].toUpperCase() === "PM"; if(pm && h < 12) h += 12; if(!pm && h === 12) h = 0; } return new Date(Date.UTC(+m[3], MON[m[1].toLowerCase()], +m[2], h, +m[5], +m[6])); }
  const t = Date.parse(s); return isNaN(t) ? null : new Date(t);
}
function parseStravaCsv(text){
  const rows = csvRows(text); if(rows.length < 2) throw "CSV-nya kosong.";
  const h = rows[0].map(x => x.trim()), ix = n => h.indexOf(n);
  const iId = ix("Activity ID"), iD = ix("Activity Date"), iT = ix("Activity Type"), iN = ix("Activity Name"), iE = ix("Elapsed Time"), iM = ix("Moving Time"), iDist = ix("Distance"), iEl = ix("Elevation Gain"), iHa = ix("Average Heart Rate"), iHm = ix("Max Heart Rate");
  if(iD < 0 || iDist < 0) throw "Ini bukan file activities.csv dari Strava (kolom tanggal/jarak nggak ketemu).";
  return rows.slice(1).map(r => {
    const dt = parseStravaDate(r[iD]); let dist = num(r[iDist]); if(dist > 300) dist = dist / 1000;
    const mv = iM >= 0 ? num(r[iM]) : NaN, el = iE >= 0 ? num(r[iE]) : NaN;
    return {extId:iId >= 0 && /^\d{1,20}$/.test((r[iId] || "").trim()) ? "strava:" + r[iId].trim() : (dt ? "t:" + dt.toISOString().slice(0,16) : null), date:dt ? ymd(dt) : null, distance:isNaN(dist) ? 0 : +dist.toFixed(2), duration:!isNaN(mv) && mv > 0 ? Math.round(mv) : (!isNaN(el) && el > 0 ? Math.round(el) : null),
      elev:iEl >= 0 && !isNaN(num(r[iEl])) ? Math.round(num(r[iEl])) : null, hrAvg:iHa >= 0 && num(r[iHa]) > 0 ? Math.round(num(r[iHa])) : null, hrMax:iHm >= 0 && num(r[iHm]) > 0 ? Math.round(num(r[iHm])) : null,
      name:iN >= 0 ? r[iN] : "Strava", isRun:iT < 0 || /run/i.test(r[iT] || "")};
  });
}
function parseActivityFile(name, text){
  const lower = name.toLowerCase();
  if(lower.endsWith(".csv")) return parseStravaCsv(text);
  const doc = new DOMParser().parseFromString(text, "application/xml");
  if(doc.getElementsByTagName("parsererror").length) throw `${name} nggak bisa dibaca.`;
  if(doc.getElementsByTagNameNS("*","Activity").length) return parseTcx(doc, name);
  if(doc.getElementsByTagNameNS("*","trkpt").length) return parseGpx(doc, name);
  throw `${name} bukan file GPX/TCX yang dikenali.`;
}
async function handleActivityFiles(files){
  const items = [], errs = [];
  for(const f of files){
    try{
      if(f.size > 30*1024*1024){ errs.push(`${f.name} kegedean (maks 30 MB).`); continue; }
      const src = /\.csv$/i.test(f.name) ? "Strava" : "File";
      parseActivityFile(f.name, await f.text()).forEach(a => { if(a.date && a.distance > 0 && a.isRun) items.push(Object.assign(a, {src})); });
    }catch(e){ errs.push(typeof e === "string" ? e : `${f.name} gagal dibaca.`); }
  }
  if(!items.length){ toast(errs[0] || "Nggak ada lari yang ketemu di file itu."); return; }
  reviewImport(items, errs);

/** Shared review step for every import source (files, Health Connect): dedupe, match to plan sessions, confirm. */
function reviewImport(items, errs = []){
  const used = new Set(S.logs.map(l => l.sessionId).filter(Boolean)), pStart = PLANW[0].start, pEnd = PLANW[PLANW.length-1].end;
  items.sort((a,b) => a.date.localeCompare(b.date)).forEach(it => {
    it.dup = WRI_INTEG.isDup(it, S.logs) || items.some(o => o !== it && o.id && o.extId && o.extId === it.extId);
    const s = allSessions().find(x => x.date === it.date && !used.has(x.id));
    if(s && !it.dup){ it.sessionId = s.id; used.add(s.id); it.type = s.type; } else { it.sessionId = null; it.type = it.distance >= 12 ? "long" : "easy"; }

    it.id = uid();

}

let RUN = null, runTick = null, audioCtx = null, wakeLock = null;
const nowMs = () => Date.now();
function runSteps(s){
  const warm = {l:"Warm-up", k:"warm", d:600, tip:"Jogging pelan + gerakan ringan (ayun kaki, putar pinggul)."}, cool = d => ({l:"Cooldown", k:"cool", d, tip:"Jogging atau jalan santai."});
  if(s.type === "locked"){
    const c = lockedCfg(s.id, s.n, s.type), tgt = c.targetPace ? `Pace ${fmtPace(c.targetPace)}` : `RPE ${c.rpe}`;
    if(c.kind === "interval" || c.kind === "tempo"){
      const st = [warm];
      for(let i = 0; i < c.reps; i++){ st.push({l:`Lari ${i+1} dari ${c.reps}`, k:"work", d:Math.round(c.work*60), tip:tgt}); if(i < c.reps-1) st.push({l:"Jogging santai", k:"rest", d:Math.round(c.rest*60), tip:"Atur napas dulu, pelan aja."}); }
      st.push(cool(300)); return st;
    }
    return [warm, {l:c.name || "Bagian inti", k:"work", d:c.targetDur || null, tip:tgt}, cool(300)];
  }
  if(s.type === "benchmark"){ const c = lockedCfg(s.id, s.n, s.type); return [warm, {l:`Benchmark ${fmtKm(c.benchKm)} km`, k:"work", d:null, tip:(c.targetPace ? `Pace ${fmtPace(c.targetPace)}. ` : "") + "Tap Lanjut pas udah sampai jaraknya."}, cool(300)]; }
  if(s.type === "elevation") return [warm, {l:"Tanjakan", k:"work", d:null, tip:"Naik 4–6 kali @1–3 menit di RPE 5–6, turun pelan. Tap Lanjut kalau beres."}, cool(600)];
  return [{l:TYPES[s.type] || "Lari", k:"run", d:null, tip:`Target ${fmtKm(s.dist)} km. ` + (s.type === "recovery" ? "RPE 2–3, santai banget." : s.type === "race" ? "Mulai pelan, satu km demi satu km." : "RPE 3–4, masih bisa ngobrol.")}];
}
function runActive(){ return RUN ? (RUN.pausedAt || nowMs()) - RUN.startedAt - RUN.pausedTotal : 0; }
function beep(n = 1, hi = false){
  try{ if(audioCtx){ for(let i = 0; i < n; i++){ const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime + i*0.22; o.frequency.value = hi ? 1046 : 784; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+0.18); o.start(t); o.stop(t+0.2); } } }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(n > 1 ? [200,100,200] : 150); }catch(e){}
}
async function lockScreen(on){ try{ if(on && navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); else if(!on && wakeLock){ await wakeLock.release(); wakeLock = null; } }catch(e){ wakeLock = null; } }
function startTicker(){ clearInterval(runTick); runTick = setInterval(runUpdate, 250); }
function runStart(id){
  const s = sessById(id); if(!s) return;
  try{ audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.resume) audioCtx.resume(); }catch(e){ audioCtx = null; }
  RUN = {id, steps:runSteps(s), i:0, stepAt:0, startedAt:nowMs(), pausedTotal:0, pausedAt:null, warned:-1};
  S.ui.run = RUN; S.ui.tut = null; M = null; persist(); lockScreen(true); beep(2, true); startTicker(); render(true);
}
function runUpdate(){
  if(!RUN){ clearInterval(runTick); return; }
  if(RUN.pausedAt) return;
  const st = RUN.steps[RUN.i], el = runActive() - RUN.stepAt;
  if(st && st.d){
    const left = st.d*1000 - el, sl = Math.ceil(left/1000), key = RUN.i*1000 + sl;
    if(sl <= 3 && sl > 0 && RUN.warned !== key){ RUN.warned = key; beep(1); }
    if(left <= 0){ runNext(); return; }
  }
  const a = document.getElementById("run-big"), b = document.getElementById("run-total"), bar = document.getElementById("run-bar");
  if(a && st) a.textContent = st.d ? fmtDur(Math.max(0, Math.ceil((st.d*1000 - el)/1000))) : fmtDur(Math.floor(el/1000));
  if(b) b.textContent = fmtDur(Math.floor(runActive()/1000));
  if(bar && st && st.d) bar.style.width = Math.min(100, el/(st.d*10)) + "%";
}
function runNext(){
  if(!RUN) return;
  if(RUN.i >= RUN.steps.length-1){ runFinish(); return; }
  RUN.i++; RUN.stepAt = runActive(); S.ui.run = RUN; persist(); beep(2, RUN.steps[RUN.i].k === "work"); render(true);
}
function runFinish(){
  if(!RUN) return;
  const s = sessById(RUN.id), secs = Math.round(runActive()/1000);
  clearInterval(runTick); lockScreen(false); beep(3, true);
  RUN = null; S.ui.run = null; persist();
  if(s) openLogModal({date:todayYmd(), type:s.type, sessionId:s.id, distance:s.dist, duration:secs > 30 ? secs : null}); else render(true);
  toast("Mantap. Cek jaraknya, terus simpan.");
}
function runOverlay(){
  const s = sessById(RUN.id), st = RUN.steps[RUN.i], nx = RUN.steps[RUN.i+1], el = runActive() - RUN.stepAt, paused = !!RUN.pausedAt;
  const c = s && (s.type === "locked" || s.type === "benchmark") ? lockedCfg(s.id, s.n, s.type) : null;

  return `<div class="runmode" role="dialog" aria-label="Timer lari">
    <div class="sec-h" style="margin:0"><span class="sm mu">${s ? esc(s.title) : ""}</span><span class="sm mu">Total <b id="run-total" class="tab">${fmtDur(Math.floor(runActive()/1000))}</b></span></div>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
      <p class="sm" style="color:${col};font-weight:700">${RUN.steps.length > 1 ? `Bagian ${RUN.i+1} dari ${RUN.steps.length}` : "Lagi lari"}${paused ? ", dijeda" : ""}</p>

      <div id="run-big" class="num" style="font-size:96px;line-height:1">${st.d ? fmtDur(Math.max(0, Math.ceil((st.d*1000 - el)/1000))) : fmtDur(Math.floor(el/1000))}</div>
      <p class="sm mu">${st.d ? "sisa waktu bagian ini" : "waktu bagian ini. Tap Lanjut kalau udah beres."}</p>

function badgeStats(){
  const ls = S.logs.filter(l => !l.sample), real = id => ls.find(l => l.sessionId === id), ss = allSessions();
  const flags = PLANW.map(w => w.sessions.every(s => real(s.id)));
  let best = 0, cur = 0; flags.forEach(f => { cur = f ? cur+1 : 0; best = Math.max(best, cur); });
  const ci = curWeekIdx(); let streak = 0; for(let i = ci; i >= 0; i--){ if(flags[i]) streak++; else if(i === ci) continue; else break; }
  const cnt = t => ss.filter(s => s.type === t && real(s.id)).length;
  return {runs:ls.length, total:sum(ls, l => l.distance), longest:ls.length ? Math.max(...ls.map(l => l.distance)) : 0, full:flags.filter(Boolean).length, bestStreak:best, streak,
    locked:cnt("locked"), elev:cnt("elevation"), bench:cnt("benchmark"), race:cnt("race") > 0, night:ss.filter(s => s.night && real(s.id)).length,
    str:S.strength.filter(r => !r.sample).length, ci:S.checkins.filter(c => !c.sample).length};
}

const RP_NOTES = {1:"Mulai pelan. Jangan ikut rombongan yang kecepetan.", 6:"Cari ritme stabil. Minum di pos sesuai kebutuhan.", 11:"Cek kaki, napas, tenaga. Ambil makan/minum yang udah dilatih.", 16:"Jaga effort. Boleh selingi jalan kalau udah pernah dicoba.", 19:"Satu km demi satu km. Tambah effort cuma kalau masih kuat."};
function rpOut(t, strat){
  const Tm = parseDur(t); if(!Tm || isNaN(Tm)) return `<p class="err">Isi target pakai format j:mm:ss (contoh 3:30:00).</p>`;
  const D = 21.0975, base = Tm/D, first = strat === "pelan" ? base + 15 : base, rest = strat === "pelan" ? (Tm - 5*first)/(D-5) : base;
  let cum = 0, rows = "";
  for(let k = 1; k <= 22; k++){
    const len = k === 22 ? D - 21 : 1, p = k <= 5 ? first : rest; cum += p*len;
    rows += `${RP_NOTES[k] ? `<tr><td colspan="3" class="sm" style="color:var(--acc-tx);padding-top:12px"><b>${RP_NOTES[k]}</b></td></tr>` : ""}<tr><td>${k === 22 ? "21,1" : k}</td><td class="tab">${fmtPace(p)}</td><td class="tab"><b>${fmtDur(cum)}</b></td></tr>`;
  }
  return `<div class="stats c3"><div><div class="v num">${fmtPace(base,false)}</div><div class="l">Rata-rata ${unitLbl()}</div></div><div><div class="v num">${fmtPace(first,false)}</div><div class="l">KM 1–5</div></div><div><div class="v num">${fmtPace(rest,false)}</div><div class="l">KM 6–finish</div></div></div>
    <div class="scroll" style="margin-top:12px"><table class="t"><tr><th>KM</th><th>Pace</th><th>Waktu di titik ini</th></tr>${rows}</table></div>
    <p class="xs mu" style="margin-top:8px">Cek cut-off dan titik cut-off resmi di race guide 2027, lalu cocokin sama kolom “Waktu di titik ini”.</p>`;
}

/* ---------- Dashboard cockpit (v4) ---------- */
/** The race route: week 1 to race day drawn as a course. Completed weeks are solid dots, you are the accent marker. */
function raceRoute(cur){
  const n = PLANW.length, W = 340, H = 76, x0 = 10, x1 = W - 22;
  const X = i => x0 + i * (x1 - x0) / (n - 1), Y = i => 34 + Math.sin(i * 0.55) * 9 + Math.sin(i * 0.17) * 6;
  const pts = PLANW.map((_, i) => [X(i), Y(i)]);
  const path = a => a.map(([x, y], i) => (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1)).join(" ");
  const ratio = w => Math.min(1, sum(logsIn(w.start, w.end).filter(l => !l.sample), l => l.distance) / w.total);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Rute latihan: minggu ${cur + 1} dari ${n} menuju race day">`;
  s += `<path d="${path(pts)}" fill="none" stroke="var(--line2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  s += `<path d="${path(pts.slice(0, cur + 1))}" fill="none" stroke="var(--tx)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  PLANW.forEach((w, i) => { if(i >= cur || i === n - 1) return; const r = ratio(w); s += `<circle cx="${X(i).toFixed(1)}" cy="${Y(i).toFixed(1)}" r="${r >= .8 ? 3 : 2.2}" fill="${r >= .8 ? "var(--tx)" : r > 0 ? "var(--mu2)" : "var(--bg)"}" stroke="${r > 0 ? "none" : "var(--mu2)"}" stroke-width="1"/>`; });
  const [fx, fy] = pts[n - 1];
  s += `<g transform="translate(${fx.toFixed(1)} ${fy.toFixed(1)})"><line x1="0" y1="0" x2="0" y2="-20" stroke="var(--tx)" stroke-width="1.5"/><rect x="0" y="-20" width="12" height="8" fill="var(--tx)"/><rect x="0" y="-20" width="4" height="4" fill="var(--bg)"/><rect x="8" y="-20" width="4" height="4" fill="var(--bg)"/><rect x="4" y="-16" width="4" height="4" fill="var(--bg)"/><circle r="3.5" fill="var(--tx)"/></g>`;
  const [cx, cy] = pts[cur];
  s += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="7" fill="var(--acc)"/><circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="2.6" fill="var(--on-acc)"/>`;
  [0, 4, 8, 12, 16, 20, 24, 28].forEach((i, b) => { if(i < n) s += `<text x="${X(i).toFixed(1)}" y="${H - 4}" font-size="9" fill="var(--mu2)" text-anchor="${i ? "middle" : "start"}" font-family="Inter,system-ui,sans-serif">${BLOCK_INFO[b].label.slice(0, 3)}</text>`; });
  return s + `</svg>`;
}
function weekVolume(n = 8){
  const ci = curWeekIdx(), from = Math.max(0, ci - n + 1);
  return PLANW.slice(from, ci + 1).map(w => ({l:"W" + w.n, a:w.total, b:+sum(logsIn(w.start, w.end).filter(l => !l.sample), l => l.distance).toFixed(1)}));
}
function sparkPace(){
  const pts = [...S.logs].filter(l => !l.sample && l.distance >= 1 && paceOf(l)).sort((a,b) => a.date.localeCompare(b.date)).slice(-12).map(l => paceOf(l));
  if(pts.length < 3) return `<p class="sm mu">Butuh minimal 3 lari dengan waktu buat grafik pace.</p>`;
  const W = 300, H = 56, lo = Math.min(...pts) - 5, hi = Math.max(...pts) + 5, X = i => 4 + i * (W - 8) / (pts.length - 1), Y = v => 6 + (H - 12) * (v - lo) / (hi - lo);
  const d = pts.map((v,i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pace ${pts.length} lari terakhir, makin atas makin cepat"><path d="${d}" fill="none" stroke="var(--tx)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((v,i) => i === pts.length - 1 ? `<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="var(--acc)"/>` : "").join("")}</svg><p class="xs mu">Terakhir ${fmtPace(pts[pts.length-1])} · terbaik dari ${pts.length} lari ${fmtPace(Math.min(...pts))}</p>`;
}
function todayReadiness(){

  return `<button class="readiness" data-act="nav" data-t="recovery" style="--c:${col}" title="Dari check-in hari ini. Panduan sederhana, bukan diagnosa."><i></i>${RD_LBL[r.st]}</button>`;
}
function dailyTip(next){
  // Deterministic, rule-based tips from the real plan/data. Weather-aware tips live in the weather card (js/views-weather.js).
  const t = todayYmd(), its = itemsOnDate(t).filter(s => s.type !== "strength"), w = PLANW[curWeekIdx()];
  if(persistentPain()) return {t:"Nyeri muncul berulang di check-in. Kurangi latihan dan pertimbangkan konsultasi.", why:"Dari check-in terakhirmu"};
  if(its.some(s => s.type === "long")) return {t:"Long run hari ini: mulai pelan, jaga RPE 3–4, dan bawa minum kalau lewat 60 menit.", why:"Dari jadwal hari ini"};
  if(its.some(s => s.type === "locked" || s.type === "benchmark")) return {t:"Sesi locked-in: pemanasan 10–15 menit dulu, lalu jaga pace yang disepakati.", why:"Dari jadwal hari ini"};
  if(w.kind.startsWith("taper")) return {t:"Minggu taper: jarak turun supaya kaki segar. Tidur jadi prioritas.", why:"Dari fase latihan"};
  if(next && next.night) return {t:"Lari malam habis kerja: pakai baju terang dan pilih rute yang ramai.", why:"Dari jadwal berikutnya"};
  return {t:"Konsisten lebih penting daripada cepat. Easy run harus terasa santai.", why:"Prinsip dasar program"};
}

/* ---------- Startup sequence: every step listed is a real task, nothing is faked ---------- */
const BOOT_STEPS = [["shell","Menyiapkan aplikasi"],["update","Cek versi terbaru"],["account","Memulihkan akun"],["data","Menyiapkan dashboard"]];
function bootStep(id, state, note){
  const ol = document.getElementById("boot-steps"); if(!ol) return;
  if(!ol.children.length) ol.innerHTML = BOOT_STEPS.map(([k,l]) => `<li data-k="${k}"><i>·</i><span>${l}</span></li>`).join("");
  const li = ol.querySelector(`[data-k="${id}"]`); if(!li) return;
  li.className = state; li.querySelector("i").textContent = state === "ok" ? "✓" : state === "skip" ? "–" : "•";
  if(note) li.querySelector("span").textContent = BOOT_STEPS.find(x => x[0] === id)[1] + " · " + note;
}
const waitFor = (cond, ms) => new Promise(res => { const t0 = Date.now(); const tick = () => { if(cond()) res(true); else if(Date.now() - t0 > ms) res(false); else setTimeout(tick, 60); }; tick(); });
async function bootSequence(){
  const t0 = Date.now();
  bootStep("shell", "ok");
  bootStep("update", "on");
  if(!isOnline()) bootStep("update", "skip", "offline");
  else { const ok = await waitFor(() => !["idle","checking"].includes(HMTPUpdate.state) || HMTPUpdate.mode === "none", 3500); bootStep("update", ok ? "ok" : "skip", ok ? (HMTPUpdate.state === "ready" ? "versi baru siap" : "terbaru") : "lewati (lambat)"); }
  bootStep("account", "on");
  const authed = await waitFor(() => !["init","loading"].includes(CLOUD.state), 4000);
  bootStep("account", authed ? "ok" : "skip", CLOUD.state === "off" ? "mode lokal" : CLOUD.user ? (CLOUD.user.displayName || "").split(" ")[0] : authed ? "belum masuk" : "lanjut offline");
  bootStep("data", "on");
  BOOTING = false; render(false); bootStep("data", "ok");
  const min = WRI_MOTION.reduced() ? 0 : 1100;
  setTimeout(() => { const b = document.getElementById("boot"); if(b){ b.classList.add("done"); setTimeout(() => b.remove(), 600); } window.__bootDone = true; maybeStartTutorial(); if(S.ui.tut) render(false); }, Math.max(0, min - (Date.now() - t0)));
}

function readLogForm(){
  const g = id => document.getElementById(id).value.trim();
  const date = g("lg-date"), type = g("lg-type"), sid = g("lg-sess") || null, dist = num(g("lg-dist")), pace = parsePace(g("lg-pace"));
  let dur = parseDur(g("lg-dur")); const errs = [];
  if(!validYmd(date)) errs.push("Tanggalnya belum bener.");
  if(!(dist > 0) || dist > 100) errs.push("Jarak harus angka antara 0 sampai 100 km.");
  if(dur !== null && isNaN(dur)) errs.push("Format waktu: mm:ss atau j:mm:ss (contoh 45:30 atau 1:05:00).");
  if(pace !== null && isNaN(pace)) errs.push("Format pace: mm:ss (contoh 7:30).");
  if((dur === null || isNaN(dur)) && pace && !isNaN(pace) && dist > 0) dur = Math.round(pace * dist);
  const opt = (id, lo, hi, label) => { const v = g(id); if(!v) return null; const n = num(v); if(isNaN(n) || n < lo || n > hi){ errs.push(`${label} harus antara ${lo} dan ${hi}.`); return null; } return n; };
  const elev = opt("lg-elev", 0, 10000, "Tanjakan"), hrAvg = opt("lg-hra", 30, 230, "HR rata-rata"), hrMax = opt("lg-hrm", 30, 240, "HR tertinggi");
  if(hrAvg && hrMax && hrMax < hrAvg) errs.push("HR tertinggi nggak bisa lebih kecil dari HR rata-rata.");
  return {errs, data:{date, type, sessionId:sid, distance:dist, duration:(dur && !isNaN(dur)) ? dur : null, elev, hrAvg, hrMax, rpe:g("lg-rpe") ? Number(g("lg-rpe")) : null, weather:g("lg-weather"), notes:g("lg-notes"), shoeId:document.getElementById("lg-shoe") ? (document.getElementById("lg-shoe").value || null) : (M.data.shoeId || null)}};
}

function csvOf(){
  const h = ["date","type","session","distance_km","duration","pace_per_km","elevation_m","hr_avg","hr_max","rpe","weather","notes","source"];
  const q = v => { v = v === null || v === undefined ? "" : String(v); return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; };
  const rows = [...S.logs].sort((a,b) => a.date.localeCompare(b.date)).map(l => { const s = l.sessionId ? sessById(l.sessionId) : null, p = paceOf(l);
    return [l.date, TYPES[l.type], s ? `W${s.n} ${s.title}` : "", l.distance, l.duration ? fmtDur(l.duration) : "", p ? `${Math.floor(Math.round(p)/60)}:${pad(Math.round(p)%60)}` : "", l.elev ?? "", l.hrAvg ?? "", l.hrMax ?? "", l.rpe ?? "", l.weather || "", l.notes || "", l.sample ? "contoh" : (l.src || "manual")].map(q).join(","); });

  saveSettings:() => {
    const g = id => document.getElementById(id).value.trim(), errs = [];
    const wd = Number(g("st-wd")); if(![0,1,3,4].includes(wd)) errs.push("Hari weekday harus Senin, Selasa, Kamis, atau Jumat.");
    let start = g("st-start"); if(!validYmd(start)) errs.push("Tanggal mulai belum bener.");
    const race = g("st-race"); if(!validYmd(race)) errs.push("Tanggal race belum bener.");
    const gt = parseDur(g("st-goal")); if(!gt || isNaN(gt)) errs.push("Target finish pakai format j:mm:ss (contoh 3:30:00).");
    const pl = num(g("st-pl")), ph = num(g("st-ph")); if(!(pl > 0) || !(ph >= pl)) errs.push("Target km: angka bawah lebih dari 0, angka atas nggak boleh lebih kecil.");
    const bk = num(g("st-bk")); if(!(bk >= 1 && bk <= 21.1)) errs.push("Jarak benchmark 1–21,1 km.");
    if(errs.length){ document.getElementById("st-err").innerHTML = `<p class="err">${errs.join("<br>")}</p>`; return; }
    const sd = parseYmd(start); start = ymd(addDays(sd, -((sd.getDay()+6)%7)));
    const changedWd = wd !== S.settings.weekday;
    const okT = v => /^\d{2}:\d{2}$/.test(v);
    Object.assign(S.settings, {wdTime:okT(g("st-wdt")) ? g("st-wdt") : S.settings.wdTime, wkTime:okT(g("st-wkt")) ? g("st-wkt") : S.settings.wkTime, weekday:wd, startDate:start, raceDate:race, goalTime:fmtDur(gt), unit:g("st-unit"), peakLow:pl, peakHigh:ph, lockedRpe:g("st-rpe") || "6–7", benchKm:bk, theme:g("st-theme")});
    const vol = S.goals.items.find(x => x.id === "volume"); if(vol) vol.target = pl;
    if(changedWd) Object.keys(S.overrides).forEach(k => { if(/-wd$|-s[AB]$/.test(k) && S.overrides[k]) delete S.overrides[k].date; });
    if(changedWd && S.schedule){   // keep a custom schedule consistent with the weekday chosen here
      const sc = Object.assign({}, S.schedule, {avail:S.schedule.avail.slice()}), old = sc.quality;
      sc.avail[wd] = true; sc.quality = wd;
      if(old !== null && old !== wd && old !== sc.long && old !== sc.recovery && !sc.strength.includes(old)) sc.avail[old] = false;
      S.schedule = WRI_SCHED.cleanSchedule(sc);
    }
    persist(); render(true);
    const raceSun = ymd(addDays(parseYmd(start), 30*7+6));
    toast(raceSun !== race ? `Tersimpan. Catatan: hari terakhir jadwal jatuh di ${fmtD(raceSun)}.` : changedWd ? "Tersimpan. Jadwal ikut geser ke hari yang baru." : "Settings tersimpan");
  },

  shoeRetire:d => { const x = S.shoes.find(s => s.id === d.id); x.retired = !x.retired; if(x.retired && S.settings.defaultShoe === x.id) S.settings.defaultShoe = null; persist(); render(true); },
  shoeAssign:() => { const id = S.settings.defaultShoe; if(!id){ toast("Pilih sepatu default dulu"); return; } let n = 0; S.logs.forEach(l => { if(!l.shoeId){ l.shoeId = id; n++; } }); persist(); render(true); toast(`${n} lari dipasang ke sepatu default`); },
  rcTick:d => { S.raceCheck = Object.assign({}, S.raceCheck); S.raceCheck[d.i] = !S.raceCheck[d.i]; persist(); render(true); },
  importHelp:() => { M = {kind:"imphelp"}; render(true); },
  impTick:d => { const it = M.items.find(x => x.id === d.id); if(it) it.sel = !it.sel; render(true); },
  impAll:d => { M.items.forEach(x => x.sel = d.v === "1"); render(true); },
  impSave:() => {
    const sel = M.items.filter(x => x.sel); let n = 0;
    sel.forEach(it => {
      const sid = it.sessionId && !logFor(it.sessionId) ? it.sessionId : null;
      if(sid) delete S.status[sid];
      S.logs.push({id:uid(), date:it.date, type:it.type, sessionId:sid, distance:it.distance, duration:it.duration, elev:it.elev || null, hrAvg:it.hrAvg, hrMax:it.hrMax, rpe:null, weather:"", notes:it.name && it.name !== it.src ? String(it.name).slice(0,120) : "", src:it.src, shoeId:S.settings.defaultShoe || null, extId:it.extId || undefined}); n++;
    });
    persist(); M = null; render(true); toast(`${n} lari ke-import`);
  },
  exportJson:() => { const o = JSON.parse(JSON.stringify(S)); delete o.ui; offerFile(`hm-training-backup-${todayYmd()}.json`, JSON.stringify(o, null, 2)); },
  exportCsv:() => offerFile(`hm-training-log-${todayYmd()}.csv`, csvOf()),
  copyText:() => { const t = document.getElementById("tx-out"); t.select(); const done = () => toast("Tersalin"); try{ navigator.clipboard.writeText(t.value).then(done, () => { document.execCommand("copy"); done(); }); }catch(e){ document.execCommand("copy"); done(); } },
  importText:() => { const err = applyImport(document.getElementById("imp-text").value); if(err) document.getElementById("imp-err").innerHTML = `<p class="err">${err}</p>`; },
  doImport:() => { const o = window.__imp; if(!o) return; makeBackup("Sebelum ganti semua (import)", S); const ui = S.ui; S = hydrate(o); S.ui = ui; delete window.__imp; lastDataJson = ""; persist(); M = null; render(true); toast("Data berhasil di-import. Backup data sebelumnya ada di Data & backup."); },
  loadSample:() => { const sd = sampleData(); S.logs = S.logs.filter(l => !l.sample).concat(sd.logs); S.strength = S.strength.filter(r => !r.sample).concat(sd.strength); S.checkins = S.checkins.filter(c => !c.sample).concat(sd.checkins.filter(c => !S.checkins.some(x => x.date === c.date))); persist(); render(true); toast("Contoh data dimuat"); },
  clearSample:() => { S.logs = S.logs.filter(l => !l.sample); S.strength = S.strength.filter(r => !r.sample); S.checkins = S.checkins.filter(c => !c.sample); persist(); render(true); toast("Contoh data dihapus"); },
  askReset:() => { M = {kind:"confirm", title:"Reset semua data?", msg:"Semua lari, progres, check-in, strength, dan settings bakal dihapus. Nggak bisa dibalikin. Export dulu kalau mau backup.", ok:"doReset", okLabel:"Reset", danger:true}; render(true); },
  doReset:() => { makeBackup("Sebelum reset", S); const tut = S.tutorial, ui = S.ui; S = defaults(); S.tutorial = tut; S.ui = Object.assign(defaults().ui, {tab:ui.tab, tourDone:true, tourV:ui.tourV}); persist(); M = null; render(false); toast("Data direset. Backup ada di Data & backup."); }
};
const LIVE = {
  pc:() => { document.getElementById("pc-out").innerHTML = pcOut(document.getElementById("pc-d").value, document.getElementById("pc-t").value); },
  pp:() => { document.getElementById("pp-out").innerHTML = ppOut(document.getElementById("pp-p").value, document.getElementById("pp-d").value); },
  rp:() => { document.getElementById("rp-out").innerHTML = rpOut(document.getElementById("rp-t").value, S.ui.rpStrat || "pelan"); },
  lgPace:() => {
    const d = num(document.getElementById("lg-dist").value), du = parseDur(document.getElementById("lg-dur").value), p = parsePace(document.getElementById("lg-pace").value), o = document.getElementById("lg-paceout");
    if(d > 0 && du && !isNaN(du)) o.innerHTML = `Pace rata-rata: <b>${fmtPace(du/d)}</b>`;
    else if(d > 0 && p && !isNaN(p)) o.innerHTML = `Waktu dari pace: <b>${fmtDur(p*d)}</b>`;
    else o.textContent = "Pace dihitung otomatis: waktu ÷ jarak. Nggak tahu waktunya? Isi pace aja.";
  },
  lgDate:el => { const sel = document.getElementById("lg-sess"); sel.innerHTML = sessOptions(el.value, sel.value || null); },
  lgSess:el => { const s = el.value ? sessById(el.value) : null; if(s){ document.getElementById("lg-type").value = s.type; const di = document.getElementById("lg-dist"); if(!di.value) di.value = fmtKm(s.dist); } },
  rsDate:el => { document.getElementById("rs-msg").innerHTML = reschedMsg(M.id, el.value); },
  ciDate:el => { const C = ciDraft(); if(validYmd(el.value)){ const ex = S.checkins.find(c => c.date === el.value); S.ui.ci = ex ? {...ex} : Object.assign({}, C, {date:el.value}); render(true); } }
};
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if(!el || el.disabled) return; const fn = ACT[el.dataset.act]; if(fn){ e.preventDefault(); fn(el.dataset, el); } });
document.addEventListener("input", e => { const el = e.target; if(el.dataset && el.dataset.live && el.tagName !== "SELECT" && el.type !== "date") LIVE[el.dataset.live] && LIVE[el.dataset.live](el); });
document.addEventListener("change", e => {
  const el = e.target;
  if(el.type === "checkbox" && el.dataset.act) return;
  if(el.dataset && el.dataset.filter){ S.ui.f[el.dataset.filter] = el.value; persist(); render(true); return; }
  if(el.id === "act-file" && el.files && el.files.length){ handleActivityFiles([...el.files]); return; }
  if(el.id === "imp-file" && el.files && el.files[0]){ el.files[0].text().then(t => { document.getElementById("imp-text").value = t; document.getElementById("imp-err").innerHTML = `<p class="sm" style="margin-top:6px">File kebaca. Pilih “Gabungkan” atau “Ganti semua”.</p>`; }, () => { document.getElementById("imp-err").innerHTML = `<p class="err">File nggak bisa dibaca.</p>`; }); return; }
  if(el.id === "mig-file" && el.files && el.files[0] && PENDING_MIG){ el.files[0].text().then(t => { let o; try{ o = JSON.parse(t); }catch(e){ o = null; } if(!o || !o.settings || !Array.isArray(o.logs)){ document.getElementById("mig-err").innerHTML = `<p class="err">Ini bukan file backup dari app ini.</p>`; return; } const P = PENDING_MIG; P.src = hydrate(o); P.srcKind = "backup"; P.preview = HMTP.mergeStates(P.cloudS, P.src, defaults); render(true); }); return; }
  if(el.id === "str-date" && S.ui.strDraft) S.ui.strDraft.date = el.value;
  if(el.dataset && el.dataset.live && (el.tagName === "SELECT" || el.type === "date")) LIVE[el.dataset.live] && LIVE[el.dataset.live](el);
});
document.addEventListener("keydown", e => { if(e.key === "Escape"){ if(M) ACT.closeM(); else if(S.ui.tut) tutFinish(false); } });
function applyLocalConflict(c){
  const recs = HMTP.stateToRecords(S);
  if(c.kind === "fields"){ const cur = Object.assign({}, recs[c.key]); c.fields.forEach(f => { cur[f.field] = f.local; }); recs[c.key] = cur; }
  else if(c.local) recs[c.key] = c.local;
  const ui = S.ui; S = HMTP.recordsToState(recs, S, defaults); S.ui = ui; persist();
}

/** Startup (called by the last script tag, after js/views-v4.js has added the v4 views). */
function startApp(){
  if(S.ui.run && Array.isArray(S.ui.run.steps)){ RUN = S.ui.run; startTicker(); }
  render(false);
  if(!Array.isArray(S.badges)){ checkBadges(); Storage.save(S); }
  initCloud();
  initUpdates();
  bootSequence();
}
</script>
